name: Auto Version Bump
description: >-
  Automatically bumps versions in package.json or .csproj files based on
  <!-- Version: TYPE --> comments in CHANGELOG.md [Unreleased] sections.
  Discovers all changelogs in the repository automatically.

inputs:
  version-files:
    description: >
      Optional JSON map of changelog path (repo-relative) to version file path (repo-relative).
      Overrides auto-discovery for specific changelogs.
      Example: '{"src/backend/Feps/CHANGELOG.md": "src/backend/Feps/Feps.Api/Feps.Api.csproj"}'
    required: false
    default: '{}'
  auto-commit:
    description: >-
      Whether to automatically commit and push the version bump changes.
      Requires the workflow to have 'contents: write' permission.
    required: false
    default: 'false'
  commit-message:
    description: >-
      Commit message used when auto-commit is enabled.
      The placeholder {updates} is replaced with the list of version updates.
    required: false
    default: 'chore: bump versions [skip ci]\n\n{updates}'
  post-bump-command:
    description: >-
      Optional shell command to run after versions are bumped but before committing.
      Use this to regenerate lockfiles or run other post-bump tasks.
      Only runs when auto-commit is enabled and changes were made.
      Example: 'cd src/frontend && pnpm install --lockfile-only'
    required: false
    default: ''
  git-user-name:
    description: Git user.name used for the auto-commit.
    required: false
    default: 'github-actions[bot]'
  git-user-email:
    description: Git user.email used for the auto-commit.
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'

outputs:
  has_changes:
    description: Whether any versions were bumped (true/false)
    value: ${{ steps.version-bump.outputs.has_changes }}
  updates:
    description: Comma-separated list of version updates performed
    value: ${{ steps.version-bump.outputs.updates }}

runs:
  using: composite
  steps:
    - name: Bump versions
      id: version-bump
      shell: bash
      env:
        INPUT_VERSION_FILES: ${{ inputs.version-files }}
      run: |
        node << 'NODEEOF'
        const fs = require('fs');
        const path = require('path');

        const root = process.env.GITHUB_WORKSPACE || process.cwd();

        const versionFilesInput = process.env.INPUT_VERSION_FILES || '{}';
        let versionFileOverrides = {};
        try {
          versionFileOverrides = JSON.parse(versionFilesInput);
        } catch {
          console.warn('⚠️  Could not parse version-files input as JSON, ignoring overrides.');
        }

        function findChangelogs(dir, results = []) {
          let entries;
          try { entries = fs.readdirSync(dir, { withFileTypes: true }); }
          catch { return results; }
          for (const entry of entries) {
            if (entry.name === 'node_modules' || entry.name === '.git') continue;
            const fullPath = path.join(dir, entry.name);
            if (entry.isDirectory()) findChangelogs(fullPath, results);
            else if (entry.name === 'CHANGELOG.md') results.push(fullPath);
          }
          return results;
        }

        function detectBumpType(content) {
          const match = content.match(/## \[Unreleased\]([\s\S]*?)(?=\n## |$)/);
          if (!match) return null;
          const versionMatch = match[1].match(/<!--\s*Version:\s*(major|minor|patch)\s*-->/i);
          return versionMatch ? versionMatch[1].toLowerCase() : null;
        }

        function findVersionFile(dir) {
          const packageJson = path.join(dir, 'package.json');
          if (fs.existsSync(packageJson)) return { path: packageJson, type: 'npm' };
          const csproj = fs.readdirSync(dir).find(f => f.endsWith('.csproj'));
          if (csproj) return { path: path.join(dir, csproj), type: 'csproj' };
          return null;
        }

        function getVersion(type, content) {
          if (type === 'npm') {
            try { return JSON.parse(content).version; } catch { return null; }
          }
          for (const tag of ['Version', 'ApplicationDisplayVersion']) {
            const m = content.match(new RegExp(`<${tag}>([^<]+)</${tag}>`));
            if (m) return m[1];
          }
          return null;
        }

        function setVersion(type, content, version) {
          if (type === 'npm') {
            const pkg = JSON.parse(content);
            pkg.version = version;
            return JSON.stringify(pkg, null, 2) + '\n';
          }
          for (const tag of ['Version', 'ApplicationDisplayVersion']) {
            const re = new RegExp(`<${tag}>[^<]+</${tag}>`);
            if (re.test(content)) return content.replace(re, `<${tag}>${version}</${tag}>`);
          }
          return content;
        }

        function bumpVersion(version, type) {
          const [major, minor, patch] = version.split('.').map(Number);
          if ([major, minor, patch].some(isNaN)) throw new Error(`Invalid version: ${version}`);
          switch (type) {
            case 'major': return `${major + 1}.0.0`;
            case 'minor': return `${major}.${minor + 1}.0`;
            case 'patch': return `${major}.${minor}.${patch + 1}`;
            default: throw new Error(`Invalid bump type: ${type}`);
          }
        }

        function updateChangelog(changelogPath, newVersion) {
          const today = new Date().toISOString().split('T')[0];
          const updated = fs.readFileSync(changelogPath, 'utf-8').replace(
            /## \[Unreleased\]\s*\n<!--\s*Version:\s*(?:major|minor|patch)\s*-->\s*\n/i,
            `## [Unreleased]\n\n## [${newVersion}] - ${today}\n\n`
          );
          fs.writeFileSync(changelogPath, updated, 'utf-8');
        }

        const updates = [];

        for (const changelogPath of findChangelogs(root)) {
          const dir = path.dirname(changelogPath);
          const bumpType = detectBumpType(fs.readFileSync(changelogPath, 'utf-8'));
          if (!bumpType) continue;

          const relChangelog = path.relative(root, changelogPath).replace(/\\/g, '/');
          let vf;
          if (versionFileOverrides[relChangelog]) {
            const overridePath = path.join(root, versionFileOverrides[relChangelog]);
            const ext = path.extname(overridePath);
            vf = { path: overridePath, type: ext === '.csproj' ? 'csproj' : 'npm' };
          } else {
            vf = findVersionFile(dir);
          }
          if (!vf) {
            console.warn(`⚠️  No version file found near ${changelogPath}`);
            console.warn(`    Tip: use the 'version-files' input to specify the path explicitly.`);
            continue;
          }

          const vfContent = fs.readFileSync(vf.path, 'utf-8');
          const currentVersion = getVersion(vf.type, vfContent);
          if (!currentVersion) {
            console.error(`❌ Could not read version from ${vf.path}`);
            continue;
          }

          let newVersion;
          try { newVersion = bumpVersion(currentVersion, bumpType); }
          catch (e) { console.error(`❌ ${e.message}`); continue; }

          fs.writeFileSync(vf.path, setVersion(vf.type, vfContent, newVersion), 'utf-8');
          updateChangelog(changelogPath, newVersion);

          const rel = path.relative(root, dir) || '.';
          updates.push(`${rel}: ${currentVersion} -> ${newVersion} (${bumpType})`);
          console.log(`✅ ${rel}: ${currentVersion} -> ${newVersion}`);
        }

        const githubOutput = process.env.GITHUB_OUTPUT;
        if (githubOutput) {
          fs.appendFileSync(githubOutput, updates.length > 0
            ? `has_changes=true\nupdates=${updates.join(', ')}\n`
            : `has_changes=false\n`);
        }
        NODEEOF

    - name: Run post-bump command
      if: inputs.auto-commit == 'true' && inputs.post-bump-command != '' && steps.version-bump.outputs.has_changes == 'true'
      shell: bash
      run: ${{ inputs.post-bump-command }}

    - name: Commit and push changes
      if: inputs.auto-commit == 'true' && steps.version-bump.outputs.has_changes == 'true'
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        UPDATES: ${{ steps.version-bump.outputs.updates }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"
        msg="${COMMIT_MESSAGE//\{updates\}/$UPDATES}"
        git add -A
        git commit -m "$msg"
        git push origin HEAD:"$GITHUB_REF"
